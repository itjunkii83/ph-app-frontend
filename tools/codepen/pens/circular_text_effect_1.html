<!DOCTYPE html>
<html lang="en" class="no-js">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Circular Text Effect</title>
  <link rel="stylesheet" href="https://use.typekit.net/kxo3pgz.css">
  <script src="https://ajax.googleapis.com/ajax/libs/webfont/1.6.26/webfont.js"></script>
  <script>
  document.documentElement.className = "js";
  var supportsCssVars = function() { var e, t = document.createElement("style"); return t.innerHTML = "root: { --tmp-var: bold; }", document.head.appendChild(t), e = !!(window.CSS && window.CSS.supports && window.CSS.supports("font-weight", "var(--tmp-var)")), t.parentNode.removeChild(t), e };
  supportsCssVars() || alert("Please view this demo in a modern browser that supports CSS Variables.");
  </script>
  <style>
*,
*::after,
*::before {
  box-sizing: border-box;
}

:root {
  font-size: 16px;
}

body {
  margin: 0;
  --color-text: #a5a5a5;
  --color-bg: #191613;
  --color-link: #d6af7c;
  --color-link-hover: #fff;
  --color-text-circle-1: #48423c;
  --color-text-circle-2: #48423c;
  --color-text-circle-3: #48423c;
  --color-text-circle-4: #48423c;
  --font-circle-1: ivymode, sans-serif;
  --font-weight-circle-1: 300;
  --font-circle-2: modesto-condensed, serif;
  --font-weight-circle-2: 400;
  --font-circle-3: minerva-modern, sans-serif;
  --font-weight-circle-3: 400;
  --font-circle-4: niagara, serif;
  --font-weight-circle-4: 300;
  --color-button: #d6ae7c;
  --color-text-button: #1d1812;
  --dim-button: 90px;
  color: var(--color-text);
  background-color: var(--color-bg);
  font-family: tenon, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Page Loader */
.js body::before,
.js body::after {
  content: '';
  position: fixed;
  z-index: 1000;
  transition: opacity 0.3s;
  opacity: 0;
  pointer-events: none;
}

.js body::before {
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: var(--color-bg);
}

.js body::after {
  content: 'Loading';
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 500;
  line-height: 1;
  color: var(--color-link);
}

.js .loading::before,
.js .loading::after {
  opacity: 1;
  pointer-events: auto;
}

a {
  text-decoration: none;
  color: var(--color-link);
  outline: none;
}

a:hover {
  color: var(--color-link-hover);
  outline: none;
}

a:focus {
  outline: none;
  background: lightgrey;
}

a:focus:not(:focus-visible) {
  background: transparent;
}

a:focus-visible {
  outline: 2px solid red;
  background: transparent;
}

.frame {
  padding: 3rem 5vw;
  text-align: center;
  position: relative;
  font-weight: 500;
  will-change: transform;
}

.js .frame {
  opacity: 0;
}

.frame__title {
  font-size: 1rem;
  margin: 0 0 1rem;
  font-weight: 500;
}

.frame__links {
  display: inline;
}

.frame__links a:not(:last-child) {
  margin: 0 1rem 0 0;
}

.enter {
  display: block;
  border: 0;
  width: var(--dim-button);
  height: var(--dim-button);
  position: absolute;
  left: calc(50% - var(--dim-button) / 2 );
  top: calc(50% - var(--dim-button) / 2 );
  font: inherit;
  font-weight: 500;
  cursor: pointer;
  background: none;
  color: var(--color-text-button);
  padding: 0;
}

.enter:focus,
.enter:hover,
.enter:active {
  outline: none;
}

.enter__bg {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background: var(--color-button);
}

.enter__text {
  position: relative;
}

.js .enter {
  opacity: 0;
}

.content {
  display: flex;
  flex-direction: column;
  width: 100vw;
  padding: 2rem;
  height: calc(100vh - 13rem);
  position: relative;
  justify-content: flex-start;
  align-items: center;
  text-align: center;
}

.js .content {
  opacity: 0;
}

.content p {
  font-size: 2rem;
  font-size: clamp(1.25rem,6vw,2.15rem);
  line-height: 1.25;
  max-width: 900px;
  margin: 0;
  pointer-events: none;
  will-change: transform;
}

.circles {
  pointer-events: none;
  position: fixed;
   --dim: 186vmin;
  width: var(--dim);
  height: var(--dim);
  top: calc(50% - var(--dim) / 2 );
  left: calc(50% - var(--dim) / 2 );
}

.circles__text {
  text-transform: uppercase;
  transform-origin: 700px 700px;
  will-change: transform, opacity;
}

.circles__text--1 {
  font-size: 25vmin;
  font-size: clamp(170px,25vmin,180px);
  font-family: var(--font-circle-1);
  font-weight: var(--font-weight-circle-1);
  fill: var(--color-text-circle-1);
}

.circles__text--2 {
  font-size: 17vmin;
  font-size: clamp(136px,17vmin,153px);
  font-family: var(--font-circle-2);
  font-weight: var(--font-weight-circle-2);
  fill: var(--color-text-circle-2);
}

.circles__text--3 {
  font-size: 13.5vmin;
  font-size: clamp(110px,13.5vmin,120px);
  font-family: var(--font-circle-3);
  font-weight: var(--font-weight-circle-3);
  fill: var(--color-text-circle-3);
}

.circles__text--4 {
  font-size: 9.5vmin;
  font-size: clamp(85px,9.5vmin,94px);
  font-family: var(--font-circle-4);
  font-weight: var(--font-weight-circle-4);
  fill: var(--color-text-circle-4);
}

@media screen and (min-width: 53em) {
  .frame {
    position: fixed;
    text-align: left;
    z-index: 100;
    top: 0;
    left: 0;
    display: grid;
    align-content: space-between;
    width: 100%;
    max-width: none;
    height: 100vh;
    padding: 2rem;
    pointer-events: none;
    grid-template-columns: 50% 50%;
    grid-template-rows: auto auto auto;
    grid-template-areas: 'title links'
              '... ...'
              '... demos';
  }
  .frame__title {
    margin: 0;
    grid-area: title;
  }
  .frame__links {
    grid-area: links;
    padding: 0;
    justify-self: end;
  }
  .frame a {
    pointer-events: auto;
  }
  .content {
    height: 100vh;
    justify-content: center;
    text-align: left;
  }
}
  </style>
</head>

<body class="demo-1 loading">
  <main>
    <svg class="circles" width="100%" height="100%" viewBox="0 0 1400 1400">
      <def>
        <path id="circle-1" d="M250,700.5A450.5,450.5 0 1 11151,700.5A450.5,450.5 0 1 1250,700.5" />
        <path id="circle-2" d="M382,700.5A318.5,318.5 0 1 11019,700.5A318.5,318.5 0 1 1382,700.5" />
        <path id="circle-3" d="M487,700.5A213.5,213.5 0 1 1914,700.5A213.5,213.5 0 1 1487,700.5" />
        <path id="circle-4" d="M567.5,700.5A133,133 0 1 1833.5,700.5A133,133 0 1 1567.5,700.5" />
      </def>
      <text class="circles__text circles__text--1">
        <textPath class="circles__text-path" xlink:href="#circle-1" aria-label="" textLength="2830">Frihed Kun Stadium  Copenhagen&nbsp;</textPath>
      </text>
      <text class="circles__text circles__text--2">
        <textPath class="circles__text-path" xlink:href="#circle-2" aria-label="" textLength="2001">Jægerspris Infinite X Playground&nbsp;</textPath>
      </text>
      <text class="circles__text circles__text--3">
        <textPath class="circles__text-path" xlink:href="#circle-3" aria-label="" textLength="1341">Mit Valg Building Næstved&nbsp;</textPath>
      </text>
      <text class="circles__text circles__text--4">
        <textPath class="circles__text-path" xlink:href="#circle-4" aria-label="" textLength="836">Køge For Kærlighed Building VI&nbsp;</textPath>
      </text>
    </svg>
    <div class="frame">
      <h1 class="frame__title">Circular Text Effect</h1>
      <nav class="frame__links">
        <a href="https://tympanus.net/codrops/?p=53487">Article</a>
        <a href="https://github.com/codrops/CircularTextEffect/">GitHub</a>
      </nav>
    </div>
    <div class="content">
      <p>We are a creative agency that focuses on human-centric design and ergonomic workplace innovations.</p>
    </div>
    <button class="enter">
      <div class="enter__bg"></div>
      <span class="enter__text">Enter</span>
    </button>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    // Utils
    const randomNumber = (min, max) => Math.floor(Math.random() * (max - min + 1) + min);

    const preloadFonts = (id) => {
      return new Promise((resolve) => {
        WebFont.load({
          typekit: { id: id },
          active: resolve
        });
      });
    };

    // Intro class
    const DOM = {
      frame: document.querySelector('.frame'),
      content: document.querySelector('.content'),
      enterCtrl: document.querySelector('.enter'),
      enterBackground: document.querySelector('.enter__bg')
    };

    class Intro {
      constructor(el) {
        this.DOM = {el: el};
        this.DOM.circleText = [...this.DOM.el.querySelectorAll('text.circles__text')];
        this.circleTextTotal = this.DOM.circleText.length;
        this.setup();
      }
      setup() {
        gsap.set(this.DOM.circleText, { transformOrigin: '50% 50%' });
        gsap.set([this.DOM.circleText, DOM.content.children, DOM.frame.children], {opacity: 0});
        gsap.set(DOM.enterCtrl, {pointerEvents: 'none'});
        this.initEvents();
      }
      initEvents() {
        this.enterMouseEnterEv = () => {
          gsap.killTweensOf([DOM.enterBackground, this.DOM.circleText]);
          gsap.to(DOM.enterBackground, {
            duration: 0.8,
            ease: 'power4',
            scale: 1.2,
            opacity: 1
          });
          gsap.to(this.DOM.circleText, {
            duration: 4,
            ease: 'power4',
            rotate: '+=180',
            stagger: { amount: -0.3 }
          });
        };
        this.enterMouseLeaveEv = () => {
          gsap.to(DOM.enterBackground, {
            duration: 0.8,
            ease: 'power4',
            scale: 1
          });
        };
        this.enterClickEv = () => this.enter();
        DOM.enterCtrl.addEventListener('mouseenter', this.enterMouseEnterEv);
        DOM.enterCtrl.addEventListener('mouseleave', this.enterMouseLeaveEv);
        DOM.enterCtrl.addEventListener('click', this.enterClickEv);
      }
      start() {
        this.startTL = gsap.timeline()
        .addLabel('start', 0)
        .to([this.DOM.circleText, DOM.enterCtrl], {
          duration: 2.5,
          ease: 'expo',
          startAt: {opacity: 0, scale: 0.3},
          scale: 1,
          opacity: 1,
          stagger: { amount: 0.5 }
        }, 'start')
        .add(() => gsap.set(DOM.enterCtrl, {pointerEvents: 'auto'}), 'start+=1');
      }
      enter() {
        this.startTL.kill();
        DOM.enterCtrl.removeEventListener('mouseenter', this.enterMouseEnterEv);
        DOM.enterCtrl.removeEventListener('mouseleave', this.enterMouseLeaveEv);
        DOM.enterCtrl.removeEventListener('click', this.enterClickEv);
        gsap.set(DOM.enterCtrl, {pointerEvents: 'none'});
        gsap.set([DOM.frame, DOM.content], {opacity: 1});
        gsap.timeline()
        .addLabel('start', 0)
        .to(DOM.enterCtrl, {
          duration: 1.5,
          ease: 'expo.inOut',
          scale: 0.7,
          opacity: 0
        }, 'start')
        .to(this.DOM.circleText, {
          duration: 1.5,
          ease: 'expo.inOut',
          scale: i => 1.5 + (this.circleTextTotal - i) * .3,
          opacity: 0,
          stagger: { amount: 0.2 }
        }, 'start')
        .to([DOM.content.children, DOM.frame.children], {
          duration: 1,
          ease: 'power3.out',
          startAt: {opacity: 0, scale: 0.9},
          scale: 1,
          opacity: 1,
          stagger: { amount: 0.3 }
        }, 'start+=1.1');
      }
    }

    // Initialize
    const intro = new Intro(document.querySelector('.circles'));
    Promise.all([preloadFonts('kxo3pgz')]).then(() => {
      document.body.classList.remove('loading');
      intro.start();
    });
  </script>
</body>

</html>
