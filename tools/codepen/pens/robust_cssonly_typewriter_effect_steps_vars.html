<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robust CSS-Only Typewriter Effect (Steps + Vars)</title>
  <style>
/* 
           1. SETUP & FONT 
           Monospace is essential for the 'ch' unit to work perfectly.
        */
@import url("https://fonts.googleapis.com/css2?family=Fira+Code:wght@500&display=swap");

:root {
  --bg-color: #0d1117;
  --text-color: #2f9c48;
  /* Terminal Green */
  --caret-color: #2f9c48;
  --font-stack: "Fira Code", monospace;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background-color: var(--bg-color);
  font-family: var(--font-stack);
  color: var(--text-color);
  overflow: hidden;
}

/* 
           2. THE COMPONENT 
        */
.terminal-loader {
  display: flex;
  flex-direction: column;
  align-items: center;
  /* Font size controls the overall scale */
  font-size: clamp(1rem, 3vw, 2rem);
}

.typewriter {
  /* 
               The magic: 
               --n is the character count passed from HTML style.
               1ch is exactly the width of 1 character in monospace.
            */
  width: calc(var(--n) * 1ch);

  /* Essential typewriter styles */
  white-space: nowrap;
  overflow: hidden;
  border-right: 0.15em solid var(--caret-color);
  /* The Cursor */

  /* Animations */
  animation: typing 3s steps(var(--n)) forwards, blink 0.7s step-end infinite;

  /* Visual polish */
  text-shadow: 0 0 5px rgba(47, 156, 72, 0.3);
}

/* 
           3. ANIMATIONS 
        */
@keyframes typing {
  from {
    width: 0;
  }

  to {
    width: calc(var(--n) * 1ch);
  }
}

@keyframes blink {
  50% {
    border-color: transparent;
  }
}

/* 
           4. ACCESSIBILITY 
           Respect users who prefer reduced motion.
        */
@media (prefers-reduced-motion: reduce) {
  .typewriter {
    animation: none;
    width: auto;
    border-right: none;
  }
}

  </style>
</head>
<body>
<div class="terminal-loader">
  <!-- 
           Set --n to the exact character count of your text 
           (including spaces) for the step animation to work perfectly.
           "This is a typing demo." = 22 chars
        -->
  <div class="typewriter" style="--n: 22" aria-label="This is a typing demo.">
    This is a typing demo.
  </div>
</div>
</body>
</html>
