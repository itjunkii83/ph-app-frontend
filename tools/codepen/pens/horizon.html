<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horizon</title>
  <style>
body {
    background-color: #000;
    margin: 0;
    overflow: hidden;
}

#canvas {
    position: absolute;
    margin: auto;
    width: 768px;
    height: 768px;
    top: 0;
    bottom: 0;
    left: 0;
    right: 0;
}
  </style>
</head>
<body>
<canvas id="canvas"></canvas>
  <script src="//cdnjs.cloudflare.com/ajax/libs/gsap/1.16.1/TweenMax.min.js"></script>
  <script>
// canvas settings
var canvas = document.getElementById("canvas"),
	 viewWidth = canvas.clientWidth,
    viewHeight = canvas.clientHeight,
    ctx,
    timeStep = (1/60),
    time = 0;

var rects = [],
    rectGradient;

window.onload = function() {
    initCanvas();
    requestAnimationFrame(loop);
};

function initCanvas() {
    canvas.width = viewWidth;
    canvas.height = viewHeight;
    ctx = canvas.getContext('2d');

    rectGradient = ctx.createLinearGradient(0, 0, 0, viewHeight);
    rectGradient.addColorStop(0, 'rgba(255,0,255,0');
    rectGradient.addColorStop(1, 'rgba(0,255,255,1');

    var w = 16;
    var h = 16;
    var dx = viewWidth / w;
    var dy = viewHeight / h;

    for (var i = 0; i < 128; i++) {
        var rect = new Rect(
            dx * (randomRange(0, w) | 0),
            viewHeight - dy + 100,
            dx,
            dy * (randomRange(1, 3) | 0)
        );

        rects.push(rect);

        TweenMax.to(rect, randomRange(1, 2), {
            y:-rect.h,
            ease:Cubic.easeIn,
            delay:randomRange(0, 0.5),
            repeat:-1
        });
    }

    TweenMax.set(canvas, {
        transformPerspective:400,
        rotationX:70,
    });

    TweenMax.to(canvas, 10, {
        rotationZ:360,
        repeat:-1,
        ease:Linear.easeNone
    })
}

function update() {
}

function draw() {
    ctx.clearRect(0, 0, viewWidth, viewHeight);

    var w = 16;
    var h = 16;
    var dx = viewWidth / w;
    var dy = viewHeight / h;

    ctx.strokeStyle = '#000';
    ctx.shadowBlur = 32;
    ctx.shadowColor = '#f0f';

    for (var i = 0; i <= w; i++) {
        ctx.beginPath();
        ctx.moveTo(i * dx, 0);
        ctx.lineTo(i * dx, viewHeight);
        ctx.stroke();
    }

    for (var j = 0; j < 32; j++) {
        ctx.beginPath();
        ctx.moveTo(0, j * dy);
        ctx.lineTo(viewWidth, j * dy);
        ctx.stroke();
    }

    ctx.shadowBlur = 0;
    ctx.fillStyle = rectGradient;
    
    rects.forEach(function(r) {
        r.draw();
    });
}

function loop() {
    update();
    draw();
    time += timeStep;
    requestAnimationFrame(loop);
}

function Rect(x, y, w, h) {
    this.x = x;
    this.y = y;
    this.w = w;
    this.h = h;
}
Rect.prototype = {
    update:function() {

    },
    draw:function() {
        ctx.fillRect(this.x, this.y, this.w, this.h);
    }
};

function randomRange(min, max) {
    return min + Math.random() * (max - min);
}
  </script>
</body>
</html>
