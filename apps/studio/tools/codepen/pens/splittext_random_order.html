<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SplitText: Random Order</title>
  <link rel="stylesheet" href="https://codepen.io/GreenSock/pen/xxmzBrw/fcaef74061bb7a76e5263dfc076c363e.css">
  <style>
* {
  box-sizing: border-box;
}
 html, body {
  height: 100vh;
  overflow: hidden;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  letter-spacing: 1.2;
}

h3 {
  color: #dfdcff;
  font-size: clamp(2rem, 6rem, 5vw);
  max-width: 45ch;
  opacity: 0;
}
  </style>
</head>
<body>
<h3 id="quote">Create text animations that will have them hanging off your every word. GSAP's text plugins have your back—bringing words to life has never been this easy!</h3>
  <script src="https://assets.codepen.io/16327/SplitText3-beta.min.js?b=39"></script>
  <script src="https://unpkg.com/gsap@3/dist/gsap.min.js"></script>
  <script>
document.fonts.ready.then(() => {
  gsap.set("#quote", {opacity: 1})
  
  let mySplitText = SplitText.create("#quote", { type: "chars, words" });

  gsap.from(mySplitText.chars, {
    duration: 2,
    opacity: 0,
    stagger: { from: "random", each: 0.01 }
  });
});

  </script>
</body>
</html>
