<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Animation</title>
  <style>
@import url("https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap");
body {
  height: 90vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #000;
  font-family: "Crimson Text", serif;
}

* {
  box-sizing: border-box;
}

.txt {
  display: flex;
  flex-wrap: wrap;
  color: #eee;
  font-size: 20px;
  cursor: pointer;
}
.txt span {
  white-space: pre;
  opacity: 0;
  transform: translate(-2px, 4px) scale(0.9);
  filter: blur(6px);
  animation: fadeIn 0.5s ease-out forwards;
}

@keyframes fadeIn {
  to {
    opacity: 1;
    transform: translate(0, 0) scale(1);
    filter: blur(0);
  }
}
  </style>
</head>
<body>
<div class="txt">Simplicity is the ultimate sophistication</div>
  <script>
document.addEventListener("DOMContentLoaded", () => {
  const txtElement = document.querySelector(".txt");
  const textContent = txtElement.textContent;

  const animateText = () => {
    txtElement.textContent = "";
    
    textContent.split("").forEach((char, index) => {
      const span = document.createElement("span");
      span.textContent = char;
      span.style.animationDelay = `${index * 0.1}s`;
      span.style.display = char === " " ? "inline-block" : "inline";
      txtElement.appendChild(span);
    });
  };

  animateText();

  txtElement.addEventListener("click", () => {
    animateText();
  });
});

  </script>
</body>
</html>
