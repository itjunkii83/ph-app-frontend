* {

  --bg: var(--light);
}
@media (prefers-color-scheme: dark) {

    --bg: var(--dark);
  }
}
body {

p[data-scroll='in'] [data-char]:after {
  -webkit-animation-name: glitch-switch;

}
.reveal--0 [data-char]:after {

          animation-iteration-count: calc(var(--char-index) * 0.55);
}
.reveal--1 [data-char]:after {
  -webkit-animation-iteration-count: 4;
          animation-iteration-count: 4;
}
.reveal--2 [data-char]:after {
  -webkit-animation-iteration-count: var(--count);
          animation-iteration-count: var(--count);
}
p:nth-of-type(1) {
  position: absolute;
  opacity: 0;
}
.word {
  position: relative;
  display: inline-block;
}
[data-char] {

  position: relative;
}
[data-char]:after {

  -webkit-animation-fill-mode: backwards;
          animation-fill-mode: backwards;
  content: var(--txt);
  color: var(--color);
  position: absolute;
  left: 0;
  top: 0;
}
