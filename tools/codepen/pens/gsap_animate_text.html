<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GSAP | Animate text</title>
  <style>
@import url("https://fonts.googleapis.com/css2?family=Montserrat&display=swap");
@import url("https://fonts.googleapis.com/css2?family=Fira+Sans:wght@700&display=swap");
*,
*::after,
*::before {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --padding-container: 16;
  --max-container: 1400px;
  --font-size-title: clamp(4.05rem, 18.78vw + -1.64rem, 11.26rem);
  --bg: hsl(0, 0%, 100%);
  --text-primary: hsl(0, 0%, 10%);
  --primary: 198, 146, 217;
  --secondary: 114, 181, 96;
}

html,
body {
  height: 100%;
  font-size: 16px;
}

body {
  background-color: var(--bg);
  width: 100vw;
  height: 100vh;
  font-family: "Montserrat", sans-serif;
  color: var(--text-primary);
  overflow: hidden;
}
@supports (height: 100dvh) {
  body {
    height: 100dvh;
  }
}
body::after {
  display: block;
  content: "";
  pointer-events: none;
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  background: transparent url("https://assets.codepen.io/108082/Noise.png") 0 0;
  background-size: 320px 320px;
  mix-blend-mode: luminosity;
}

.title {
  display: flex;
  place-items: center;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  padding: 0 calc(var(--padding-container) * 1vmin);
  width: 100%;
  height: 100%;
  mix-blend-mode: difference;
  background: aliceblue;
}
@-moz-document url-prefix() {
  .title {
    mix-blend-mode: unset;
    background: transparent;
  }
}
.title h1 {
  position: relative;
  margin: 0 auto;
  width: min(100%, 800px);
  font: bold var(--font-size-title) "Fira Sans", sans-serif;
  text-align: center;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.title h1 > span {
  position: relative;
  display: flex;
  justify-content: space-between;
}
.title h1 > span .after {
  display: block;
  position: absolute;
  width: 0%;
  height: 95%;
  background-color: var(--text-primary);
}
.title h1 > span:first-child .after {
  inset-inline-end: 0;
}

.dots {
  display: flex;
  position: fixed;
  inset-block-end: 2rem;
  inset-inline-end: 2rem;
}
.dots .dot {
  background: transparent;
  border: 2px solid rgb(var(--primary));
  width: 1rem;
  height: 1rem;
  border-radius: 50%;
  margin-inline: 0.2rem;
}
.dots .dot.active {
  background-color: rgb(var(--primary));
}
.dots .dot:hover {
  cursor: pointer;
  background-color: rgba(var(--primary), 0.42);
}
  </style>
</head>
<body>
<div class="title">
  <h1><span><span style="filter: blur(22.3749px) contrast(28.0364); background: rgba(255, 255, 255, 0.933); opacity: 0.0677; will-change: opacity;">D</span><span style="filter: blur(17.6402px) contrast(22.3152); background: rgba(255, 255, 255, 0.733); opacity: 0.265; will-change: opacity;">o</span><span style="filter: blur(21.1423px) contrast(26.5469); background: rgba(255, 255, 255, 0.882); opacity: 0.1191; will-change: opacity;">l</span><span style="filter: blur(15.3708px) contrast(19.573); background: rgba(255, 255, 255, 0.64); opacity: 0.3596; will-change: opacity;">o</span><span style="filter: blur(12.7557px) contrast(16.4132); background: rgba(255, 255, 255, 0.533); opacity: 0.4685; will-change: opacity;">r</span><span style="filter: blur(9.9809px) contrast(13.0603); background: rgba(255, 255, 255, 0.416); opacity: 0.5841; will-change: opacity;">e</span>
      <div class="after"></div></span><span><span style="filter: blur(19.564px) contrast(24.6399); background: rgba(255, 255, 255, 0.816); opacity: 0.1848; will-change: opacity;">M</span><span style="filter: blur(7.5272px) contrast(10.0953); background: rgba(255, 255, 255, 0.314); opacity: 0.6864; will-change: opacity;">a</span><span style="filter: blur(5.419px) contrast(7.548); background: rgba(255, 255, 255, 0.227); opacity: 0.7742; will-change: opacity;">g</span><span style="filter: blur(3.6564px) contrast(5.4182); background: rgba(255, 255, 255, 0.153); opacity: 0.8476; will-change: opacity;">n</span><span style="filter: blur(2.2395px) contrast(3.706); background: rgba(255, 255, 255, 0.094); opacity: 0.9067; will-change: opacity;">a</span>
      <div class="after"></div></span></h1>
</div>
<footer class="dots">
  <button class="dot active" data-effect="1"></button>
  <button class="dot" data-effect="2"></button>
  <button class="dot" data-effect="3"></button>
  <button class="dot" data-effect="4"></button>
  <button class="dot" data-effect="5"></button>
  <button class="dot" data-effect="6"></button>
  <button class="dot" data-effect="7"></button>
</footer>
  <script src="https://unpkg.co/gsap@3/dist/gsap.min.js"></script>
  <script>
"use strict";
const titleChars = document.querySelectorAll(".title h1 > span > span");
const titleSpans = document.querySelectorAll(".title h1 > span");
const titleSpansAfters = document.querySelectorAll(".title h1 .after");
const effects = document.querySelectorAll("[data-effect]");
const animationTitle = gsap.timeline();
function animateTitle(effect) {
    animationTitle.clear();
    switch (effect) {
        case 1: {
            animationTitle.fromTo(titleChars, {
                "will-change": "opacity",
                opacity: 0,
                background: "#fff",
                filter: "blur(24px) contrast(30)"
            }, {
                opacity: 1,
                background: "transparent",
                filter: "blur(0px) contrast(1)",
                ease: "power1.inOut",
                stagger: {
                    each: 0.03,
                    from: "random"
                }
            });
            break;
        }
        case 2: {
            animationTitle.fromTo(titleChars, {
                "will-change": "opacity",
                opacity: 0,
                filter: "blur(20px)"
            }, {
                ease: "power2.inOut",
                opacity: 1,
                filter: "blur(0px)",
                stagger: {
                    each: 0.05,
                    from: "random"
                }
            });
            break;
        }
        case 3: {
            animationTitle.fromTo(titleChars, {
                "will-change": "opacity, transform",
                opacity: 0,
                yPercent: 50
            }, {
                duration: 1.6,
                opacity: 1,
                yPercent: 0,
                ease: "elastic.out(1.2, 0.5)",
                stagger: {
                    each: 0.03
                }
            });
            break;
        }
        case 4: {
            animationTitle.fromTo(titleChars, {
                "will-change": "opacity, transform",
                scaleX: 0.2,
                scaleY: 12,
                opacity: 0,
                filter: "blur(20px)"
            }, {
                scaleY: 1,
                scaleX: 1,
                opacity: 1,
                filter: "blur(0px)",
                stagger: {
                    amount: 0.42,
                    from: "start"
                }
            });
            break;
        }
        case 5: {
            titleSpans.forEach(span => gsap.set(span.parentNode, { perspective: 2000 }));
            const animSpanFrom = {
                "will-change": "opacity, transform",
                opacity: 0,
            };
            const animSpanTo = {
                duration: 0.62,
                opacity: 1,
                rotationX: 0,
                yPercent: 0,
                ease: 'power1.inOut',
                stagger: {
                    each: 0.1
                }
            };
            animationTitle
                .fromTo(titleSpans[0], Object.assign(Object.assign({}, animSpanFrom), { rotationX: 90, yPercent: -50 }), animSpanTo)
                .fromTo(titleSpans[1], Object.assign(Object.assign({}, animSpanFrom), { rotationX: -90, yPercent: 50 }), animSpanTo, '<')
                .fromTo(titleSpansAfters, {
                width: "100%"
            }, {
                duration: 0.72,
                ease: "expo.inOut",
                width: "0%"
            }, "end");
            break;
        }
        case 6: {
            animationTitle.fromTo(titleChars, {
                "will-change": "opacity, transform",
                transformOrigin: 'center',
                scaleX: -1,
                opacity: 0
            }, {
                duration: 1.2,
                scaleX: 1,
                opacity: 1,
                ease: "elastic.out(1.2, 0.3)",
                stagger: {
                    each: 0.1
                }
            });
            break;
        }
        case 7: {
            titleChars.forEach(char => gsap.set(char.parentNode, { perspective: 2000 }));
            animationTitle.fromTo(titleChars, {
                "will-change": "opacity, transform",
                opacity: 0,
                rotationX: -90,
                yPercent: 50
            }, {
                ease: 'power1.inOut',
                opacity: 1,
                rotationX: 0,
                yPercent: 0,
                stagger: {
                    each: 0.03,
                }
            });
            break;
        }
        default:
            return;
    }
}
effects.forEach((btn) => {
    let numEffect = btn.getAttribute("data-effect");
    btn.addEventListener("click", () => {
        effects.forEach((b) => {
            if (b.classList.contains("active")) {
                b.classList.remove("active");
            }
        });
        btn.classList.add("active");
        if (animationTitle) {
            animationTitle.progress(1);
        }
        animateTitle(parseInt(numEffect));
    });
});
window.addEventListener("load", async () => {
    animateTitle(1);
});
  </script>
</body>
</html>
